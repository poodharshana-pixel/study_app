<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <h1>Student Registration</h1><p class="subtitle">Enter student details</p>
  <form id="studentForm">
    <label for="studentId">Student ID</label><input id="studentId" required>
    <label for="name">Student Name</label><input id="name" required>
    <label for="email">Email</label><input id="email" type="email" required>
    <label for="department">Department</label>
    <select id="department" required><option value="">Choose</option><option>IT</option><option>CSE</option><option>ECE</option></select>
    <div class="actions"><button type="submit">Register / Update</button><button type="reset" class="secondary">Clear</button></div>
  </form>
  <p id="message" role="status" aria-live="polite"></p>
  <h2>Registered Students</h2>
  <div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Actions</th></tr></thead><tbody id="studentList"></tbody></table></div>
</main><script src="app.js"></script>
</body></html>
